[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"


[project]
name = "monoprop-qiskit"
authors = [
  { name = "Algorithmiq Development Team", email = "aurora@algorithmiq.fi" },
]
description = "Convert Qiskit circuits and operators to and from monoprop's native representations."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "monoprop",
  "qiskit>=2.0.0",
]


[project.urls]
Homepage = "https://github.com/Algorithmiq/monoprop"
"Bug Tracker" = "https://github.com/Algorithmiq/monoprop/issues"
Changelog = "https://github.com/Algorithmiq/monoprop/releases"


[dependency-groups]
test = ["pytest>=8.2.2,<9.1", "pytest-cases>=3.8.6,<4"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]


[tool.uv.sources]
monoprop = { workspace = true }

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.hooks.vcs]
version-file = "src/monoprop_qiskit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/monoprop_qiskit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
