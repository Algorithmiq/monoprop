default_language_version.python = "python3"
exclude = "^(.cruft.json|.copier-answers.yml|performance_scripts/data\\.py|performance_scripts/csvs/)$"
default_stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files" },
    { id = "check-case-conflict" },
    { id = "check-merge-conflict" },
    { id = "check-symlinks" },
    { id = "check-toml" },
    { id = "check-yaml", args = [
        "--allow-multiple-documents",
    ] },
    { id = "destroyed-symlinks" },
    { id = "end-of-file-fixer", exclude = "\\.(json)$" },
    { id = "mixed-line-ending" },
    { id = "no-commit-to-branch", args = [
        "--pattern",
        "[^a-zA-Z0-9_/-]",
    ] },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "debug-statements" },
    { id = "name-tests-test", args = [
        "--pytest-test-first",
    ], exclude = "^tests/cases\\.py$|.*\\.json$" },
    { id = "forbid-submodules" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.20"
hooks = [
    { id = "ruff-check" },
    { id = "ruff-format", args = [
        "--check",
    ] },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.11.28"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-clang-format"
rev = "v21.1.0"
hooks = [
    { id = "clang-format", types_or = [
        "c++",
        "c",
        "cuda",
    ], verbose = true, args = [
        "--verbose",
    ] },
]

[[repos]]
repo = "https://github.com/BlankSpruce/gersemi-pre-commit"
rev = "0.27.7"
hooks = [{ id = "gersemi", exclude = "^(cmake/CPM\\.cmake$)" }]

[[repos]]
repo = "https://github.com/Lucas-C/pre-commit-hooks"
rev = "v1.5.6"
hooks = [
    { id = "insert-license", name = "check Python license header", types = [
        "python",
    ], args = [
        "--license-filepath",
        ".github/license-header.txt",
        "--comment-style",
        "#",
    ] },
    { id = "insert-license", name = "check C++ license header", files = "\\.(cpp|h|hpp|c|cc|cxx|cuda|cu|cuh|inl)(\\.in)?$", exclude = "(^|/)(CMakeLists\\.txt|.*\\.cmake)$", args = [
        "--license-filepath",
        ".github/license-header.txt",
        "--comment-style",
        "//",
    ] },
]

[[repos]]
repo = "local"
hooks = [
    { id = "check-workflow-commands", name = "check workflows call recipes", language = "python", entry = "python tools/check-workflow-commands.py", files = "^\\.github/workflows/.*\\.ya?ml$", pass_filenames = true, additional_dependencies = [
        "PyYAML",
    ] },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.37.4"
hooks = [
    { id = "check-dependabot" },
    { id = "check-github-workflows" },
    { id = "check-github-actions" },
]
