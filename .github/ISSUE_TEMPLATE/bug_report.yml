name: Bug report
description: Report a bug or unexpected behavior in monoprop
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Import ...
        2. Call ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (x86_64)
        - Linux (aarch64 / ARM64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: install_tool
    attributes:
      label: Installation tool
      options:
        - pip
        - uv
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: install_artifact
    attributes:
      label: Installation artifact
      description: Did you install a pre-built wheel or build from source (sdist)?
      options:
        - Wheel (pre-built binary)
        - sdist (built from source)
        - Editable install from source (git clone)
    validations:
      required: true

  - type: textarea
    id: sdist_details
    attributes:
      label: Source build details (sdist only)
      description: |
        If you built from source, please provide:
        - Compiler name and version (e.g. `g++ 13.2`, `clang++ 17`)
        - Versions of key build dependencies (oneTBB, Boost, fmt, nanobind)
        - How you installed those dependencies (e.g. system package manager, Conda, manual build)
      placeholder: |
        Compiler: clang++ 17.0.6
        oneTBB: 2021.11
        Boost: 1.84
        fmt: 10.2
        Installed via: apt / homebrew / conda / manual

  - type: input
    id: monoprop_version
    attributes:
      label: monoprop version
      placeholder: "e.g. 0.3.1 — run: python -c \"import monoprop; print(monoprop.__version__)\""
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.9 — run: python --version"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, tracebacks, screenshots, or any other relevant information.
