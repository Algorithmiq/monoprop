name: Build and test project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # PRs trigger for all the default events
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  COLUMNS: 120
  CPM_USE_LOCAL_PACKAGES: "TRUE"

jobs:
  package-tests:
    name: Test [mpi:${{ matrix.mpi }}] ${{ matrix.runner }} py${{ matrix.python-version }} ${{ matrix.compiler }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
        compiler: [default, g++-14, clang++-18]
        mpi: ["off"]
        exclude:
          - compiler: g++-14
            python-version: "3.14"
          - compiler: clang++-18
            python-version: "3.14"
          - compiler: g++-14
            runner: macos-15
          - compiler: clang++-18
            runner: macos-15
        include:
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            mpi: "on"
          - python-version: "3.11"
            runner: ubuntu-26.04-arm
            compiler: default
            mpi: "on"
          - python-version: "3.11"
            runner: macos-15
            compiler: default
            mpi: "on"

    runs-on: ${{ matrix.runner}}

    env:
      monoprop_ENABLE_MPI: "${{ matrix.mpi }}"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set build environment variables
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          fi
          if [[ "${{ matrix.compiler }}" != "default" ]]; then
            echo "CXX=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          fi

      - name: Set up the build environment
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.compiler }}-mpi-${{ matrix.mpi }}
          mpi: ${{ matrix.mpi }}

      - name: Install package
        run: just build --group workspace-test

      - name: Python environment information
        run: |
          uv tree

      - name: Get monoprop information
        run: just info

      - name: Verify that find_package(monoprop) works
        run: |
          mkdir -p find-package-smoke

          cat > find-package-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(monoprop_find_package_smoke LANGUAGES CXX)

          set(CMAKE_CXX_EXTENSIONS OFF)

          find_package(monoprop CONFIG REQUIRED)

          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE monoprop::monoprop)
          EOF

          cat > find-package-smoke/main.cpp <<'EOF'
          #include "monoprop/MonomialPropagator.h"
          #include "monoprop/detail/mpi/MPICompat.h"

          #include <complex>
          #include <optional>
          #include <vector>

          using namespace monoprop;

          auto main() -> int {
              mpi::init();
              {
                  constexpr size_t kModes = 2;
                  OperatorDict ham;
                  ham[VecZ{0, 1}] = std::complex<double>{0.0, 1.0};

                  // Graph-building / Schrodinger path: detail/graph_encoding/MPGraphEncodingStorage.h.
                  MonomialPropagator<kModes> graph_sim(ham,
                                                       2 * kModes,
                                                       VecZ{0, 1},
                                                       std::optional<unsigned int>{4U},
                                                       MPI_COMM_SELF,
                                                       std::nullopt,
                                                       std::nullopt,
                                                       CutoffType::Length,
                                                       std::nullopt);
                  const std::vector<VecZ> monos{{0}, {1}, {2}};
                  graph_sim.build_graph(monos, VecZ{0, 1, 2}, VecD{1.0, 1.0, 1.0});
                  graph_sim.graph_memory_usage();
                  graph_sim.expectation_value_and_gradient(VecD{0.1, 0.2, 0.3});

                  MonomialPropagator<kModes> partition_sim(ham,
                                                           2 * kModes,
                                                           VecZ{0, 1},
                                                           std::nullopt,
                                                           MPI_COMM_SELF,
                                                           std::nullopt,
                                                           std::nullopt,
                                                           CutoffType::Length,
                                                           std::nullopt,
                                                           kModes,
                                                           Basis::Majorana,
                                                           2);
                  partition_sim.size();
              }
              mpi::finalize();
              return 0;
          }
          EOF

          cmake -S find-package-smoke -B find-package-smoke/build -Dmonoprop_DIR="$(uv run --no-sync python -c "import sysconfig; print(sysconfig.get_path('purelib'))")"/monoprop/cmake

          cmake --build find-package-smoke/build

          find-package-smoke/build/smoke

      - name: Get test group label
        id: test-group-label
        run: |
          runner="${{ matrix.runner }}"
          pyver="${{ matrix.python-version }}"
          compiler="${{ matrix.compiler }}"
          mpi="mpi=${{ matrix.mpi }}"
          echo "label=$runner-$pyver-$compiler-$mpi" >> $GITHUB_OUTPUT

      - name: Run Python tests
        run: just test-py "${{ steps.test-group-label.outputs.label }}"

      - name: Run non-MPI C++ unit tests
        run: just test-cpp "${{ steps.test-group-label.outputs.label }}"

      - name: Run C++ unit tests under MPI
        if: matrix.mpi == 'on'
        run: just test-cpp-mpi "${{ steps.test-group-label.outputs.label }}"

      - name: Run Python tests under MPI
        if: matrix.mpi == 'on'
        run: just test-py-mpi 2

      - name: Run Python MPI marker rank matrix
        if: matrix.mpi == 'on'
        run: just test-py-mpi "1;2;4" -m mpi

      - name: Upload serial test results to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: pytest-${{ steps.test-group-label.outputs.label }}.xml, ctest-serial-${{ steps.test-group-label.outputs.label }}.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

      - name: Upload MPI C++ test results to Codecov
        if: matrix.mpi == 'on'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ctest-mpi-${{ steps.test-group-label.outputs.label }}.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
