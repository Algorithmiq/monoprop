name: Build and test project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # PRs trigger for all the default events
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  COLUMNS: 120
  CPM_USE_LOCAL_PACKAGES: "TRUE"

jobs:
  package-tests:
    name: Test [mpi:${{ matrix.mpi }}, wide:${{ matrix.wide }}] ${{ matrix.runner }} py${{ matrix.python-version }} ${{ matrix.compiler }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
        compiler: [default, g++-14, clang++-18]
        wide: ["off"]
        mpi: ["off"]
        exclude:
          - compiler: g++-14
            python-version: "3.14"
          - compiler: clang++-18
            python-version: "3.14"
          - compiler: g++-14
            runner: macos-15
          - compiler: clang++-18
            runner: macos-15
        include:
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            wide: "on"
            mpi: "off"
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            wide: "off"
            mpi: "on"
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            wide: "on"
            mpi: "on"
          - python-version: "3.11"
            runner: ubuntu-26.04-arm
            compiler: default
            wide: "off"
            mpi: "on"
          - python-version: "3.11"
            runner: macos-15
            compiler: default
            wide: "off"
            mpi: "on"

    runs-on: ${{ matrix.runner}}

    env:
      SKBUILD_CMAKE_DEFINE: "monoprop_WIDE_TERM_INDEX=${{ matrix.wide }};monoprop_ENABLE_MPI=${{ matrix.mpi }}"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            brew install boost open-mpi msgpack-cxx hwloc
          else
            sudo apt-get update
            packages="libopenmpi-dev openmpi-bin libboost-dev libboost-test-dev libmsgpack-cxx-dev libhwloc-dev"
            if [[ "${{ matrix.compiler }}" == "clang++-18" ]]; then
              packages="$packages clang-18"
            fi
            sudo apt-get install -y $packages
          fi

      - name: Set build environment variables
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          fi
          if [[ "${{ matrix.compiler }}" != "default" ]]; then
            echo "CXX=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          fi

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          uv sync --no-progress --group workspace-test --all-extras -v

      - name: Python environment information
        run: |
          uv tree

      - name: Get monoprop information
        run: |
          uv run python <<'EOF'
          import pprint

          import monoprop as mp

          pprint.pprint(
            {
              "version": mp.__version__,
              "variant": mp.__variant__,
              "compiler_flags": mp.__compiler_flags__,
              "MPI": mp.has_mpi,
            }
          )
          EOF

      - name: Verify that find_package(monoprop) works
        run: |
          mkdir -p find-package-smoke

          cat > find-package-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(monoprop_find_package_smoke LANGUAGES CXX)

          set(CMAKE_CXX_EXTENSIONS OFF)

          find_package(monoprop CONFIG REQUIRED)

          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE monoprop::monoprop)
          EOF

          cat > find-package-smoke/main.cpp <<'EOF'
          #include "monoprop/MonomialPropagator.h"
          #include "monoprop/detail/mpi/MPICompat.h"

          #include <complex>
          #include <optional>
          #include <vector>

          using namespace monoprop;

          auto main() -> int {
              constexpr size_t kModes = 2;
              OperatorDict ham;
              ham[VecZ{0, 1}] = std::complex<double>{0.0, 1.0};

              // Graph-building / Schrodinger path: detail/graph_encoding/MPGraphEncodingStorage.h.
              MonomialPropagator<kModes> graph_sim(ham,
                                                   2 * kModes,
                                                   VecZ{0, 1},
                                                   std::optional<unsigned int>{4U},
                                                   MPI_COMM_SELF,
                                                   std::nullopt,
                                                   std::nullopt,
                                                   CutoffType::Length,
                                                   std::nullopt);
              const std::vector<VecZ> monos{{0}, {1}, {2}};
              graph_sim.build_graph(monos, VecZ{0, 1, 2}, VecD{1.0, 1.0, 1.0});
              graph_sim.graph_memory_usage();
              graph_sim.expectation_value_and_gradient(VecD{0.1, 0.2, 0.3});

              MonomialPropagator<kModes> partition_sim(ham,
                                                       2 * kModes,
                                                       VecZ{0, 1},
                                                       std::nullopt,
                                                       MPI_COMM_SELF,
                                                       std::nullopt,
                                                       std::nullopt,
                                                       CutoffType::Length,
                                                       std::nullopt,
                                                       kModes,
                                                       Basis::Majorana,
                                                       2);
              partition_sim.size();

              return 0;
          }
          EOF

          cmake -S find-package-smoke -B find-package-smoke/build -Dmonoprop_DIR="$(uv run --no-sync python -c "import sysconfig; print(sysconfig.get_path('purelib'))")"/monoprop/cmake

          cmake --build find-package-smoke/build

          find-package-smoke/build/smoke

      - name: Get test group label
        id: test-group-label
        run: |
          runner="${{ matrix.runner }}"
          pyver="${{ matrix.python-version }}"
          compiler="${{ matrix.compiler }}"
          wide="wide=${{ matrix.wide }}"
          mpi="mpi=${{ matrix.mpi }}"
          echo "label=$runner-$pyver-$compiler-$wide-$mpi" >> $GITHUB_OUTPUT

      - name: Run Python tests
        run: |
          uv run pytest \
          -r aR \
          --durations=50 \
          --durations-min=5.0 \
          --junit-xml=pytest-"${{ steps.test-group-label.outputs.label }}".xml \
          -o junit_family=legacy

      - name: Run C++ unit tests
        run: |
          ctest --test-dir build/editable/Release --output-on-failure --output-junit ctest-"${{ steps.test-group-label.outputs.label }}".xml

      - name: Run Python tests under MPI
        if: matrix.mpi == 'on'
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          mpiexec --map-by :OVERSUBSCRIBE -n 2 \
            uv run --no-sync pytest tests --with-mpi -v

      - name: Run Python MPI marker rank matrix
        if: matrix.mpi == 'on'
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          for r in 1 2 4; do
            echo "Running MPI python tests with ${r} rank(s)"
            mpiexec --map-by :OVERSUBSCRIBE -n "$r" \
              uv run --no-sync pytest tests --with-mpi -m mpi -v
          done

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: pytest-${{ steps.test-group-label.outputs.label }}.xml, ctest-${{ steps.test-group-label.outputs.label }}.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
