name: Build and test project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # PRs trigger for all the default events
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 3
  COLUMNS: 120
  CPM_USE_LOCAL_PACKAGES: "TRUE"

jobs:
  package-tests:
    name: Test [mpi:${{ matrix.mpi }}] [${{ matrix.runtime }}] ${{ matrix.runner }} py${{ matrix.python-version }} ${{ matrix.compiler }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
        compiler: [default, g++-14, clang++-18]
        mpi: ["off"]
        # The in-process runtime the build selects. Default builds run the legacy partition runtime; the sharded
        # OpenMP runtime is built with the temporary monoprop_SHARDED_OPENMP_PROTOTYPE option until the switch.
        runtime: [legacy]
        exclude:
          - compiler: g++-14
            python-version: "3.14"
          - compiler: clang++-18
            python-version: "3.14"
          - compiler: g++-14
            runner: macos-15
          - compiler: clang++-18
            runner: macos-15
        include:
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            mpi: "on"
          - python-version: "3.11"
            runner: ubuntu-26.04-arm
            compiler: default
            mpi: "on"
          - python-version: "3.11"
            runner: macos-15
            compiler: default
            mpi: "on"
          # The sharded OpenMP runtime: MPI-off and MPI legs on each platform, and the other Linux compilers.
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            mpi: "off"
            runtime: sharded
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            mpi: "on"
            runtime: sharded
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: g++-14
            mpi: "off"
            runtime: sharded
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: clang++-18
            mpi: "off"
            runtime: sharded
          - python-version: "3.11"
            runner: ubuntu-26.04-arm
            compiler: default
            mpi: "on"
            runtime: sharded
          - python-version: "3.11"
            runner: macos-15
            compiler: default
            mpi: "off"
            runtime: sharded

    runs-on: ${{ matrix.runner}}

    env:
      monoprop_ENABLE_MPI: "${{ matrix.mpi }}"
      # Both values explicit, so a leg never inherits the other runtime's build.
      SKBUILD_CMAKE_DEFINE: "monoprop_SHARDED_OPENMP_PROTOTYPE=${{ matrix.runtime == 'sharded' && 'ON' || 'OFF' }}"
      # A mislabelled build fails the identity tests instead of skipping them.
      monoprop_TEST_EXPECT_RUNTIME: "${{ matrix.runtime }}"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set build environment variables
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          fi
          if [[ "${{ matrix.compiler }}" != "default" ]]; then
            echo "CXX=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          fi

      - name: Set up the build environment
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          # The two runtimes are ABI-incompatible: never restore one's wheel into the other's leg.
          cache-suffix: ${{ matrix.compiler }}-mpi-${{ matrix.mpi }}-${{ matrix.runtime }}
          mpi: ${{ matrix.mpi }}

      - name: Install package
        run: just build --group workspace-test

      - name: Python environment information
        run: |
          uv tree

      - name: Get monoprop information
        run: just info

      - name: Verify the runtime and MPI identity of the build
        run: just check-runtime "${{ matrix.runtime }}"

      - name: Verify that find_package(monoprop) works
        run: just test-find-package

      - name: Get test group label
        id: test-group-label
        run: |
          runner="${{ matrix.runner }}"
          pyver="${{ matrix.python-version }}"
          compiler="${{ matrix.compiler }}"
          mpi="mpi=${{ matrix.mpi }}"
          runtime="runtime=${{ matrix.runtime }}"
          echo "label=$runner-$pyver-$compiler-$mpi-$runtime" >> $GITHUB_OUTPUT

      - name: Run Python tests
        run: just test-py "${{ steps.test-group-label.outputs.label }}"

      - name: Run non-MPI C++ unit tests
        run: just test-cpp "${{ steps.test-group-label.outputs.label }}"

      - name: Run C++ unit tests under MPI
        if: matrix.mpi == 'on'
        run: just test-cpp-mpi "${{ steps.test-group-label.outputs.label }}"

      - name: Run Python tests under MPI
        if: matrix.mpi == 'on'
        run: just test-py-mpi 2

      - name: Run Python MPI marker rank matrix
        if: matrix.mpi == 'on'
        run: just test-py-mpi "1;2;4" -m mpi

      - name: Upload serial test results to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: pytest-${{ steps.test-group-label.outputs.label }}.xml, ctest-serial-${{ steps.test-group-label.outputs.label }}.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

      - name: Upload MPI C++ test results to Codecov
        if: matrix.mpi == 'on'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ctest-mpi-${{ steps.test-group-label.outputs.label }}.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

  tests:
    name: All tests
    if: always()
    needs: package-tests
    runs-on: ubuntu-slim

    steps:
      - name: Report the matrix result
        run: |
          echo "package-tests: ${{ needs.package-tests.result }}"
          case "${{ needs.package-tests.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
