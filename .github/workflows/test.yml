name: Build and test project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # PRs trigger for the "opened", "reopened", "synchronize" events (default) and
  # "ready_for_review"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # when new commits are pushed to the PR
      - ready_for_review # when the PR is un-drafted

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  # Directory where build-wrapper output will be placed
  BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory
  COLUMNS: 120
  CPM_USE_LOCAL_PACKAGES: "TRUE"

jobs:
  python-checks:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: Check bindings for ${{ matrix.python-version }} on ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15

    runs-on: ${{ matrix.runner}}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set gcc-14/g++-14 as default compilers
        if: ${{ matrix.runner != 'macos-15' }}
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          sudo update-alternatives --set g++ /usr/bin/g++-14
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
          sudo update-alternatives --set c++ /usr/bin/g++-14

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            brew install boost tbb open-mpi
          else
            sudo apt-get update
            sudo apt-get install -y libopenmpi-dev openmpi-bin libtbb-dev
            ./tools/install-deps.sh /opt/Software --skip-boost-test --skip-msgpack
          fi

      - name: Set build environment variables
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          else
            echo "CMAKE_PREFIX_PATH=/opt/Software" >> "$GITHUB_ENV"
          fi

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          echo "Building with CMAKE_BUILD_PARALLEL_LEVEL=$CMAKE_BUILD_PARALLEL_LEVEL on ${{ matrix.runner }}"
          uv sync --no-progress --group test --all-extras -v

      - name: Python environment information
        run: |
          uv tree

      - name: Get monoprop version
        run: |
          uv run python -c "import monoprop as mp; print(mp.__version__)"

      - name: Get test group label
        id: test-group-label
        run: |
          runner="${{ matrix.runner }}"
          pyver="${{ matrix.python-version }}"
          echo "label=$runner-$pyver" >> $GITHUB_OUTPUT

      - name: Run tests
        run: |
          export COVERAGE_FILE="coverage-${{ steps.test-group-label.outputs.label }}"

          uv run coverage run \
          -m pytest \
          -r aR \
          --durations=50 \
          --durations-min=5.0 \
          --junit-xml=pytest-"${{ steps.test-group-label.outputs.label }}".xml \
          -o junit_family=legacy

      - name: Run Python tests under MPI
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          mpiexec --map-by :OVERSUBSCRIBE -n 2 \
            uv run pytest tests --with-mpi -v

      - name: Run Python MPI marker rank matrix
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          for r in 1 2 4; do
            echo "Running MPI python tests with ${r} rank(s)"
            mpiexec --map-by :OVERSUBSCRIBE -n "$r" \
              uv run pytest tests --with-mpi -m mpi -v
          done

      - name: Upload Test Results as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test_results_${{ steps.test-group-label.outputs.label }}
          path: |
            pytest-*.xml
            coverage-*
          retention-days: 1

  cpp-checks:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: Check C++ on ubuntu-latest (coverage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set gcc-14/g++-14 as default compilers
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          sudo update-alternatives --set g++ /usr/bin/g++-14
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
          sudo update-alternatives --set c++ /usr/bin/g++-14

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev libopenmpi-dev openmpi-bin
          ./tools/install-deps.sh /opt/Software

      - name: Configure
        run: |
          export CMAKE_PREFIX_PATH=/opt/Software
          cmake -S. -Bbuild -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Coverage

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          ctest --test-dir build --output-junit ../ctest-ubuntu_latest.xml

      - name: Verify CMake install and find_package(monoprop)
        run: |
          cmake --install build --prefix "$PWD/monoprop-install"

          mkdir -p find-package-smoke

          cat > find-package-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(monoprop_find_package_smoke LANGUAGES CXX)

          find_package(monoprop CONFIG REQUIRED)

          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE monoprop::monoprop)
          EOF

          cat > find-package-smoke/main.cpp <<'EOF'
          auto main() -> int { return 0; }
          EOF

          cmake -S find-package-smoke -B find-package-smoke/build \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH="/opt/Software;$PWD/monoprop-install"

          cmake --build find-package-smoke/build

      - name: Upload C++ Test Results as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test_results_cpp_ubuntu_latest
          path: ctest-*.xml
          retention-days: 1

      - name: Collect coverage into a gcovr tracefile
        run: |
          pipx run gcovr \
            --gcov-executable gcov-14 \
            --gcov-ignore-parse-errors \
            --root . \
            --filter '^(src|include)/' \
            --exclude '^tests/' \
            --exclude '^src/example\.cpp$' \
            build \
            --json cpp-coverage-native.json

      - name: Upload C++ coverage tracefile as artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpp_coverage_native
          path: cpp-coverage-native.json
          retention-days: 1

  python-bindings-coverage:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: Collect C++ coverage through the Python bindings
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Build the compiled extension with the Coverage build type so the C++
      # code exercised through the Python bindings is instrumented for gcov.
      SKBUILD_CMAKE_BUILD_TYPE: Coverage
      # Keep the instrumented build directory around so gcov can find the
      # .gcno/.gcda files after the tests have run.
      SKBUILD_BUILD_DIR: ${{ github.workspace }}/build-python-coverage

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set gcc-14/g++-14 as default compilers
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          sudo update-alternatives --set g++ /usr/bin/g++-14
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
          sudo update-alternatives --set c++ /usr/bin/g++-14

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libtbb-dev
          ./tools/install-deps.sh /opt/Software --skip-boost-test --skip-msgpack

      - name: Set build environment variables
        run: |
          echo "CMAKE_PREFIX_PATH=/opt/Software" >> "$GITHUB_ENV"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install package
        run: |
          uv sync --no-progress --group test --all-extras -v

      - name: Run tests to exercise the bindings
        run: |
          uv run pytest tests -r aR

      - name: Collect coverage into a gcovr tracefile
        run: |
          pipx run gcovr \
            --gcov-executable gcov-14 \
            --gcov-ignore-parse-errors \
            --root . \
            --filter '^(src|include)/' \
            --exclude '^tests/' \
            --exclude '^src/example\.cpp$' \
            "$SKBUILD_BUILD_DIR" \
            --json cpp-coverage-python.json

      - name: Upload C++ coverage tracefile as artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpp_coverage_python
          path: cpp-coverage-python.json
          retention-days: 1

  upload-coverage:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: Upload coverage to Codecov
    runs-on: ubuntu-latest
    needs:
      - python-checks
      - cpp-checks
      - python-bindings-coverage

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: .

      - name: Convert Python coverage data to XML
        run: |
          for f in coverage-*; do
            COVERAGE_FILE="$f" pipx run coverage xml -o "${f}.xml"
          done

      - name: Convert C++ tracefiles to Cobertura XML
        run: |
          # --merge-lines: collapse gcov's per-instantiation duplicate line
          # records into one aggregated line each (see the SonarQube step for the
          # full rationale) so the Codecov report reflects true line coverage.
          for f in cpp-coverage-*.json; do
            pipx run gcovr \
              --root . \
              --merge-lines \
              --add-tracefile "$f" \
              --cobertura "${f%.json}.xml"
          done

      - name: Remove non-XML coverage files
        run: |
          # Both conversion steps above leave their sources next to the
          # generated .xml (the raw coverage.py binaries and the gcovr .json
          # tracefiles). codecov-action auto-discovers everything in the
          # directory, so drop the non-XML sources to avoid uploading each
          # report twice.
          rm -f cpp-coverage-*.json
          find . -maxdepth 1 -name 'coverage-*' ! -name '*.xml' -delete

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  sonarqube-analysis:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs:
      - python-checks
      - cpp-checks
      - python-bindings-coverage

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Python coverage artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: .

      - name: Combine Python coverage data
        run: |
          pipx run coverage combine coverage-*
          pipx run coverage xml -o coverage.xml

      - name: Combine C++ coverage tracefiles into one SonarQube report
        run: |
          # --merge-lines collapses the multiple per-line coverage records that
          # gcov emits for template instantiations (and across the native +
          # python-bindings tracefiles) into a single lineToCover per source
          # line, marked covered if ANY instantiation covers it. Without it the
          # SonarQube report contains duplicate lineToCover entries whose
          # covered= values conflict; SonarCloud keeps only the last, discarding
          # most real coverage of the heavily-templated headers and sinking
          # new_coverage far below the true value.
          pipx run gcovr \
            --root . \
            --merge-lines \
            --add-tracefile 'cpp-coverage-*.json' \
            --sonarqube coverage_cpp.xml

      - name: Set gcc-14/g++-14 as default compilers
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          sudo update-alternatives --set g++ /usr/bin/g++-14
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
          sudo update-alternatives --set c++ /usr/bin/g++-14

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtbb-dev libopenmpi-dev openmpi-bin
          ./tools/install-deps.sh /opt/Software

      - name: Install matching Build Wrapper
        run: |
          curl --location --output build-wrapper-linux-x86.zip \
            https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip -q -o build-wrapper-linux-x86.zip

      - name: Configure for SonarQube CFamily analysis
        run: |
          export CMAKE_PREFIX_PATH=/opt/Software
          cmake -S. -Bbuild-sonar -DCMAKE_CXX_COMPILER=g++

      - name: Build with Build Wrapper
        run: |
          ./build-wrapper-linux-x86/build-wrapper-linux-x86-64 \
            --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} \
            cmake --build build-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json

  cpp-checks-other:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: Check C++ on ${{ matrix.runner }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            compiler: gcc-14
            cmake_cxx_compiler: g++
          - runner: ubuntu-24.04-arm
            compiler: clang-18
            cmake_cxx_compiler: clang++
          - runner: ubuntu-latest
            compiler: clang-18
            cmake_cxx_compiler: clang++
          - runner: macos-15
            compiler: apple-clang
            cmake_cxx_compiler: clang++

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set gcc-14/g++-14 as default compilers
        if: ${{ matrix.compiler == 'gcc-14' }}
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          sudo update-alternatives --set g++ /usr/bin/g++-14
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
          sudo update-alternatives --set c++ /usr/bin/g++-14

      - name: Set clang-18/clang++-18 as default compilers
        if: ${{ matrix.compiler == 'clang-18' }}
        run: |
          if ! command -v clang-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-18
          fi
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 180
          sudo update-alternatives --set clang /usr/bin/clang-18
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-18 180
          sudo update-alternatives --set cc /usr/bin/clang-18
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 180
          sudo update-alternatives --set clang++ /usr/bin/clang++-18
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-18 180
          sudo update-alternatives --set c++ /usr/bin/clang++-18

      - name: Install dependencies
        if: ${{ matrix.runner != 'macos-15' }}
        run: |
          sudo apt-get update
          sudo apt-get install libtbb-dev libopenmpi-dev openmpi-bin
          ./tools/install-deps.sh /opt/Software

      - name: Install dependencies
        if: ${{ matrix.runner == 'macos-15' }}
        run: |
          brew install boost msgpack-cxx tbb open-mpi

      - name: Configure
        if: ${{ matrix.runner != 'macos-15' }}
        run: |
          export CMAKE_PREFIX_PATH=/opt/Software
          cmake -S. -Bbuild -DCMAKE_CXX_COMPILER=${{ matrix.cmake_cxx_compiler }}

      - name: Configure
        if: ${{ matrix.runner == 'macos-15' }}
        run: |
          export MACOSX_DEPLOYMENT_TARGET=15.0
          cmake -S. -Bbuild -DCMAKE_CXX_COMPILER=${{ matrix.cmake_cxx_compiler }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          ctest --test-dir build --output-junit ../ctest-${{ matrix.runner }}-${{ matrix.compiler }}.xml

      - name: Upload Test Results as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test_results_cpp_${{ matrix.runner }}_${{ matrix.compiler }}
          path: |
            ctest-*.xml
          retention-days: 1

  publish-test-results:
    name: "Publish Tests Results"
    needs:
      - python-checks
      - cpp-checks
      - python-bindings-coverage
      - cpp-checks-other

    runs-on: ubuntu-latest
    permissions:
      checks: write

      # only needed unless run with comment_mode: off
      pull-requests: write

      # only needed for private repository
      contents: read

      # only needed for private repository
      issues: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # grab the history of the PR, so setuptools-scm can compute the correct version number
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: .

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            pytest-*.xml
            ctest-*.xml


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
