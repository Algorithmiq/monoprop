name: Build and test project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # PRs trigger for all the default events
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 3
  COLUMNS: 120
  CPM_USE_LOCAL_PACKAGES: "TRUE"

permissions:
  contents: read

jobs:
  package-tests:
    name: Test [mpi:${{ matrix.mpi }}] ${{ matrix.runner }} py${{ matrix.python-version }} ${{ matrix.compiler }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
        compiler: [default, g++-14, clang++-18]
        mpi: ["off"]
        exclude:
          - compiler: g++-14
            python-version: "3.15"
          - compiler: clang++-18
            python-version: "3.15"
          - compiler: g++-14
            runner: macos-15
          - compiler: clang++-18
            runner: macos-15
        include:
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            mpi: "on"
          - python-version: "3.11"
            runner: ubuntu-26.04-arm
            compiler: default
            mpi: "on"
          - python-version: "3.11"
            runner: macos-15
            compiler: default
            mpi: "on"

    runs-on: ${{ matrix.runner}}
    timeout-minutes: 60

    env:
      monoprop_ENABLE_MPI: "${{ matrix.mpi }}"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set build environment variables
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          fi
          if [[ "${{ matrix.compiler }}" != "default" ]]; then
            echo "CXX=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          fi

      - name: Set up the build environment
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.compiler }}-mpi-${{ matrix.mpi }}
          mpi: ${{ matrix.mpi }}

      - name: Install package
        run: just build --group workspace-test

      - name: Python environment information
        run: |
          uv tree

      - name: Get monoprop information
        run: just info

      - name: Verify that find_package(monoprop) works
        run: just test-find-package

      - name: Get test group label
        id: test-group-label
        run: |
          runner="${{ matrix.runner }}"
          pyver="${{ matrix.python-version }}"
          compiler="${{ matrix.compiler }}"
          mpi="mpi=${{ matrix.mpi }}"
          echo "label=$runner-$pyver-$compiler-$mpi" >> $GITHUB_OUTPUT

      - name: Run Python tests
        run: just test-py "${{ steps.test-group-label.outputs.label }}"

      - name: Run non-MPI C++ unit tests
        run: just test-cpp "${{ steps.test-group-label.outputs.label }}"

      - name: Run C++ unit tests under MPI
        if: matrix.mpi == 'on'
        run: just test-cpp-mpi "${{ steps.test-group-label.outputs.label }}"

      - name: Run Python tests under MPI
        if: matrix.mpi == 'on'
        run: just test-py-mpi "${{ steps.test-group-label.outputs.label }}"

      - name: Upload serial test results to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: pytest-${{ steps.test-group-label.outputs.label }}.xml, ctest-serial-${{ steps.test-group-label.outputs.label }}.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

      - name: Upload MPI test results to Codecov
        if: matrix.mpi == 'on'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            ctest-mpi-${{ steps.test-group-label.outputs.label }}.xml,
            pytest-mpi-${{ steps.test-group-label.outputs.label }}-ranks1.xml,
            pytest-mpi-${{ steps.test-group-label.outputs.label }}-ranks2.xml,
            pytest-mpi-${{ steps.test-group-label.outputs.label }}-ranks4.xml,
            pytest-mpi-${{ steps.test-group-label.outputs.label }}-ranks3-splitmix.xml,
            pytest-mpi-${{ steps.test-group-label.outputs.label }}-ranks2-partitions2.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

  tests:
    name: All tests
    if: always()
    needs: package-tests
    runs-on: ubuntu-slim

    steps:
      - name: Report the matrix result
        run: |
          echo "package-tests: ${{ needs.package-tests.result }}"
          case "${{ needs.package-tests.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
