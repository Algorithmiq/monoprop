name: Build and test project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # PRs trigger for the "opened", "reopened", "synchronize" events (default) and
  # "ready_for_review"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # when new commits are pushed to the PR
      - ready_for_review # when the PR is un-drafted

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  COLUMNS: 120
  CPM_USE_LOCAL_PACKAGES: "TRUE"

jobs:
  package-tests:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: Check project ${{ matrix.runner }}/Python ${{ matrix.python-version }}/Compiler ${{ matrix.compiler}}/Wide term index ${{ matrix.wide}}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15]
        compiler: [default, g++-14, clang++-18]
        wide: ["off"]
        exclude:
          - compiler: g++-14
            python-version: "3.14"
          - compiler: clang++-18
            python-version: "3.14"
          - compiler: g++-14
            runner: macos-15
          - compiler: clang++-18
            runner: macos-15
        include:
          - python-version: "3.11"
            runner: ubuntu-26.04
            compiler: default
            wide: "on"

    runs-on: ${{ matrix.runner}}

    env:
      SKBUILD_CMAKE_DEFINE: "monoprop_WIDE_TERM_INDEX=${{ matrix.wide }}"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            brew install boost open-mpi msgpack-cxx
          else
            sudo apt-get update
            packages="libopenmpi-dev openmpi-bin libboost-dev libboost-test-dev libmsgpack-cxx-dev"
            if [[ "${{ matrix.compiler }}" == "clang++-18" ]]; then
              packages="$packages clang-18"
            fi
            sudo apt-get install -y $packages
          fi

      - name: Set build environment variables
        run: |
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          fi
          if [[ "${{ matrix.compiler }}" != "default" ]]; then
            echo "CXX=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          fi

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          uv sync --no-progress --group test --all-extras -v

      - name: Python environment information
        run: |
          uv tree

      - name: Get monoprop version
        run: |
          uv run python -c "import monoprop as mp; print(mp.__version__)"

      - name: Verify that find_package(monoprop) works
        run: |
          mkdir -p find-package-smoke

          cat > find-package-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(monoprop_find_package_smoke LANGUAGES CXX)

          find_package(monoprop CONFIG REQUIRED)

          add_executable(smoke main.cpp)
          target_link_libraries(smoke PRIVATE monoprop::monoprop)
          EOF

          cat > find-package-smoke/main.cpp <<'EOF'
          auto main() -> int { return 0; }
          EOF

          cmake -S find-package-smoke -B find-package-smoke/build -Dmonoprop_DIR="$(uv run --no-sync python -c "import sysconfig; print(sysconfig.get_path('purelib'))")"/monoprop/cmake

          cmake --build find-package-smoke/build

      - name: Get test group label
        id: test-group-label
        run: |
          runner="${{ matrix.runner }}"
          pyver="${{ matrix.python-version }}"
          compiler="${{ matrix.compiler }}"
          wide="${{ matrix.wide }}"
          echo "label=$runner-$pyver-$compiler-$wide" >> $GITHUB_OUTPUT

      - name: Run Python tests
        run: |
          uv run pytest \
          -r aR \
          --durations=50 \
          --durations-min=5.0 \
          --junit-xml=pytest-"${{ steps.test-group-label.outputs.label }}".xml \
          -o junit_family=legacy

      - name: Run C++ unit tests
        run: |
          ctest --test-dir build/editable/Release --output-on-failure --output-junit ctest-"${{ steps.test-group-label.outputs.label }}".xml

      - name: Run Python tests under MPI
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          mpiexec --map-by :OVERSUBSCRIBE -n 2 \
            uv run pytest tests --with-mpi -v

      - name: Run Python MPI marker rank matrix
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          for r in 1 2 4; do
            echo "Running MPI python tests with ${r} rank(s)"
            mpiexec --map-by :OVERSUBSCRIBE -n "$r" \
              uv run pytest tests --with-mpi -m mpi -v
          done

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: pytest-${{ steps.test-group-label.outputs.label }}.xml, ctest-"${{ steps.test-group-label.outputs.label }}".xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

  code-coverage:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: Check code coverage
    runs-on: ubuntu-26.04
    env:
      SKBUILD_CMAKE_BUILD_TYPE: "Coverage"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libboost-dev libboost-test-dev libmsgpack-cxx-dev

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install package
        run: |
          uv sync --no-progress --group test --all-extras -v

      - name: Run Python tests
        run: |
          uv run pytest \
          -r aR \
          --cov=src/monoprop \
          --cov-report=xml:python-coverage.xml \
          --durations=50 \
          --durations-min=5.0

      - name: Collect coverage into a gcovr tracefile (C++ through Python bindings)
        run: |
          uvx gcovr \
            --gcov-executable gcov \
            --gcov-ignore-parse-errors \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --root . \
            --filter '^(src|include)/' \
            --exclude '^tests/' \
            "build/editable/Coverage" \
            --json cpp-coverage-through-python-bindings.json

      - name: Convert C++ tracefile to Cobertura XML for Codecov (C++ through Python bindings)
        run: |
          uvx gcovr \
            --root . \
            --merge-lines \
            --add-tracefile cpp-coverage-through-python-bindings.json \
            --cobertura cpp-coverage-through-python-bindings.xml

      - name: Run C++ unit tests
        run: |
          ctest --test-dir build/editable/Coverage --output-on-failure

      - name: Collect coverage into a gcovr tracefile (C++ unit tests)
        run: |
          uvx gcovr \
            --gcov-executable gcov \
            --gcov-ignore-parse-errors \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --root . \
            --filter '^(src|include)/' \
            --exclude '^tests/' \
            "build/editable/Coverage" \
            --json cpp-coverage.json

      - name: Convert C++ tracefile to Cobertura XML for Codecov (C++ unit tests)
        run: |
          uvx gcovr \
            --root . \
            --merge-lines \
            --add-tracefile cpp-coverage.json \
            --cobertura cpp-coverage.xml

      - name: Upload C++ coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python-coverage.xml, cpp-coverage-through-python-bindings.xml, cpp-coverage.xml
          flags: cpp
          disable_search: true
          fail_ci_if_error: true

  sonarqube-analysis:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'test-in-draft') }}

    name: SonarQube analysis
    runs-on: ubuntu-26.04
    env:
      SKBUILD_CMAKE_DEFINE: "monoprop_ENABLE_MPI=ON"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenmpi-dev openmpi-bin libboost-dev libboost-test-dev libmsgpack-cxx-dev

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install package
        run: |
          uv sync --no-progress --all-extras -v

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.compile-commands=build/editable/Release/compile_commands.json
