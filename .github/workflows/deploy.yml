name: Publish monoprop Python sdist and wheels to PyPI

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
    # PRs trigger for the "opened", "reopened", "synchronize" events (default) and
    # "ready_for_review"
    paths:
      - .github/workflows/deploy.yml
      - pyproject.toml
    types:
      - opened
      - reopened
      - synchronize # when new commits are pushed to the PR
      - ready_for_review # when the PR is un-drafted

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COLUMNS: 120
  FORCE_COLOR: 3

jobs:
  check-pr-changes:
    name: Check PR changes for deploy workflow
    runs-on: ubuntu-26.04
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: changed-deploy-workflow
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: .github/workflows/deploy.yml
      - id: changed-pyproject
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: pyproject.toml
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOY_WORKFLOW_CHANGED: ${{ steps.changed-deploy-workflow.outputs.any_changed }}
          PYPROJECT_CHANGED: ${{ steps.changed-pyproject.outputs.any_changed }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import os
          import subprocess
          import tomllib

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          deploy_workflow_changed = os.environ["DEPLOY_WORKFLOW_CHANGED"] == "true"
          pyproject_changed = os.environ["PYPROJECT_CHANGED"] == "true"

          if deploy_workflow_changed:
              should_run = True
          elif not pyproject_changed:
              should_run = False
          else:
              def read_file(sha: str) -> str | None:
                  try:
                      return subprocess.check_output(
                          ["git", "show", f"{sha}:pyproject.toml"], text=True
                      )
                  except subprocess.CalledProcessError:
                      return None

              def get_cibuildwheel_config(content: str | None):
                  if content is None:
                      return None
                  data = tomllib.loads(content)
                  return data.get("tool", {}).get("cibuildwheel")

              base_cfg = get_cibuildwheel_config(read_file(base_sha))
              head_cfg = get_cibuildwheel_config(read_file(head_sha))
              should_run = base_cfg != head_cfg

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should-run={'true' if should_run else 'false'}\n")
          PY

  build-sdist:
    name: Build source distribution
    needs: check-pr-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-pr-changes.outputs.should-run == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # such that setuptools_scm can do its job correctly

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build SDist
        run: |
          uv tool run --from build pyproject-build --verbose --sdist --installer uv

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build-wheels:
    # in combination with the PR types selection, this top-level if statement
    # skips running the workflow for Draft PRs
    needs: check-pr-changes
    if: ${{ github.event_name != 'pull_request' || (needs.check-pr-changes.outputs.should-run == 'true' && !github.event.pull_request.draft) }}
    name: Build Python wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [ linux-intel, linux-arm, macos-arm ]
        include:
          - archs: native
            platform: auto
          - os: linux-intel
            runs-on: ubuntu-26.04
          - os: linux-arm
            runs-on: ubuntu-26.04-arm
          - os: macos-arm
            runs-on: macos-15

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pypa/cibuildwheel@v4.1.1
        with:
          extras: "uv"
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_DEBUG_TRACEBACK: TRUE

      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  upload_pypi:
    name: Upload to PyPI
    needs:
      - build-sdist
      - build-wheels
    if: github.event_name == 'release' && github.event.action == 'published'

    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1

  upload_release_assets:
    name: Upload wheels and sdist to GitHub release
    needs:
      - build-sdist
      - build-wheels
    if: github.event_name == 'release' && github.event.action == 'published'

    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload wheels and sdist to release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
