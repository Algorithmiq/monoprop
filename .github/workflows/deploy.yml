name: Publish monoprop Python sdist and wheels to PyPI

on:
  workflow_dispatch:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/deploy.yml
      - VERSION
      - pyproject.toml
      - packages/monoprop-bench-tools/pyproject.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COLUMNS: 120
  FORCE_COLOR: 3

permissions:
  contents: read

jobs:
  check-pr-changes:
    name: Check PR changes for deploy workflow
    runs-on: ubuntu-26.04
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: changed-deploy-workflow
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: .github/workflows/deploy.yml
      - id: changed-version
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: VERSION
      - id: changed-pyproject
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: pyproject.toml
      - id: changed-bench-tools-pyproject
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: packages/monoprop-bench-tools/pyproject.toml
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOY_WORKFLOW_CHANGED: ${{ steps.changed-deploy-workflow.outputs.any_changed }}
          VERSION_CHANGED: ${{ steps.changed-version.outputs.any_changed }}
          PYPROJECT_CHANGED: ${{ steps.changed-pyproject.outputs.any_changed }}
          BENCH_TOOLS_PYPROJECT_CHANGED: ${{ steps.changed-bench-tools-pyproject.outputs.any_changed }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import os
          import subprocess
          import tomllib

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          deploy_workflow_changed = os.environ["DEPLOY_WORKFLOW_CHANGED"] == "true"
          version_changed = os.environ["VERSION_CHANGED"] == "true"
          pyproject_changed = os.environ["PYPROJECT_CHANGED"] == "true"
          bench_tools_changed = os.environ["BENCH_TOOLS_PYPROJECT_CHANGED"] == "true"

          if deploy_workflow_changed or version_changed or bench_tools_changed:
              should_run = True
          elif not pyproject_changed:
              should_run = False
          else:
              def read_file(sha: str) -> str | None:
                  try:
                      return subprocess.check_output(
                          ["git", "show", f"{sha}:pyproject.toml"], text=True
                      )
                  except subprocess.CalledProcessError:
                      return None

              def get_cibuildwheel_config(content: str | None):
                  if content is None:
                      return None
                  data = tomllib.loads(content)
                  return data.get("tool", {}).get("cibuildwheel")

              base_cfg = get_cibuildwheel_config(read_file(base_sha))
              head_cfg = get_cibuildwheel_config(read_file(head_sha))
              should_run = base_cfg != head_cfg

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should-run={'true' if should_run else 'false'}\n")
          PY

  build-sdist:
    name: Build source distribution
    needs: check-pr-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-pr-changes.outputs.should-run == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # such that setuptools_scm can do its job correctly

      - name: Check release version
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(tr -d '[:space:]' < VERSION)"

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::VERSION is '$actual', but the release tag is '$expected'"
            exit 1
          fi

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Build SDist
        run: |
          uv tool run --from build pyproject-build --verbose --sdist --installer uv

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build-bench-tools:
    name: Build monoprop-bench-tools
    needs: check-pr-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-pr-changes.outputs.should-run == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # such that hatch-vcs can read the tags

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Build sdist and wheel
        run: uv build --package monoprop-bench-tools --out-dir bench-tools-dist

      - uses: actions/upload-artifact@v7
        with:
          name: bench-tools-dist
          path: bench-tools-dist/*

  build-wheels:
    needs: check-pr-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-pr-changes.outputs.should-run == 'true' }}
    name: Build Python wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ linux-intel, linux-arm, macos-arm ]
        include:
          - archs: native
            platform: auto
          - os: linux-intel
            runs-on: ubuntu-26.04
          - os: linux-arm
            runs-on: ubuntu-26.04-arm
          - os: macos-arm
            runs-on: macos-15

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pypa/cibuildwheel@v4.3.1
        with:
          extras: "uv"
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_DEBUG_TRACEBACK: TRUE

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  test-wheels:
    name: Test wheel with ${{ matrix.mpi }} (${{ matrix.mpi4py }} mpi4py) on ${{ matrix.runner }}
    needs: build-wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Version floors: Ubuntu 22.04 ships Open MPI 4.1.2 and MPICH 4.0; impi-rt 2021.1.1 is the
          # oldest Intel MPI on PyPI. Its Boost (1.74) is below monoprop's 1.85, so the C++
          # consumer runs only on macOS here (and in test.yml); inspect-mpi still checks the headers.
          - { runner: ubuntu-22.04, artifact: linux-intel, mpi: openmpi-4.1, setup-mpi: "on", build-deps: "false", mpi4py: source, packages: "", abi: openmpi, mpi-include: /usr/lib/x86_64-linux-gnu/openmpi/include, cpp: false }
          - { runner: ubuntu-22.04, artifact: linux-intel, mpi: openmpi-4.1, setup-mpi: "on", build-deps: "false", mpi4py: wheel, packages: "", abi: "", mpi-include: "", cpp: false }
          - { runner: ubuntu-22.04, artifact: linux-intel, mpi: mpich-4.0, setup-mpi: mpich, build-deps: "false", mpi4py: source, packages: "", abi: mpich, mpi-include: /usr/include/x86_64-linux-gnu/mpich, cpp: false }
          - { runner: ubuntu-22.04, artifact: linux-intel, mpi: mpich-4.0, setup-mpi: mpich, build-deps: "false", mpi4py: wheel, packages: "", abi: "", mpi-include: "", cpp: false }
          - { runner: ubuntu-22.04, artifact: linux-intel, mpi: intel-2021.1, setup-mpi: "off", build-deps: "false", mpi4py: wheel, packages: "impi-rt==2021.1.1", abi: "", mpi-include: "", cpp: false }
          # Latest Intel MPI, and Homebrew Open MPI (the macOS rpath allowlist)
          - { runner: ubuntu-26.04, artifact: linux-intel, mpi: intel-latest, setup-mpi: "off", build-deps: "false", mpi4py: wheel, packages: impi-rt, abi: "", mpi-include: "", cpp: false }
          - { runner: macos-15, artifact: macos-arm, mpi: homebrew-openmpi, setup-mpi: "on", build-deps: "true", mpi4py: wheel, packages: "", abi: "", mpi-include: "", cpp: true }
    env:
      MONOPROP_TEST_VENV: ${{ github.workspace }}/.wheel-test-venv
      PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1

      # test-wheel-mpi.sh creates its venv from $PYTHON; pin the interpreter instead of relying on
      # the runner image's python3 and its venv module.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-${{ matrix.artifact }}-*
          path: dist
          merge-multiple: true

      - name: Set up the build environment
        uses: ./.github/actions/setup
        with:
          python-version: "3.12"
          cache-suffix: wheel-test-${{ matrix.mpi }}-${{ matrix.mpi4py }}
          mpi: ${{ matrix.setup-mpi }}
          build-deps: ${{ matrix.build-deps }}

      - name: Check configure's MPI inspection on the system headers
        if: matrix.mpi-include != ''
        run: just inspect-mpi "${{ matrix.mpi-include }}" ${{ matrix.abi }}

      - name: Test the wheel under MPI
        run: just test-wheel dist ${{ matrix.mpi4py }} ${{ matrix.packages }}

      - name: Build a C++ consumer against the installed wheel
        if: matrix.cpp
        run: just test-find-package build/find-package-smoke "$MONOPROP_TEST_VENV/bin/python"

  upload_pypi:
    name: Upload to PyPI
    needs:
      - build-sdist
      - build-wheels
      - test-wheels
    if: github.event_name == 'release' && github.event.action == 'published'

    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  upload_pypi_bench_tools:
    # Separate from `upload_pypi` because it is a separate PyPI project, with its own
    # trusted-publisher entry
    name: Upload monoprop-bench-tools to PyPI
    needs: build-bench-tools
    if: github.event_name == 'release' && github.event.action == 'published'

    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bench-tools-dist
          path: dist

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  upload_release_assets:
    name: Attach wheels and sdist to GitHub release
    needs:
      - build-sdist
      - build-wheels
      - test-wheels
      - build-bench-tools
    if: github.event_name == 'release' && github.event.action == 'published'

    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: bench-tools-dist
          path: dist

      - name: Upload wheels and sdist to release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
