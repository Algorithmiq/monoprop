name: Nix flake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    # `nix/monoprop.nix` restates the build inputs, the CMake options and the source
    # set by hand, so it goes stale whenever the upstream build definition moves.
    paths:
      - .github/workflows/nix.yml
      - flake.lock
      - flake.nix
      - nix/**
      - VERSION
      - pyproject.toml
      - CMakeLists.txt
      - cmake/**
      - cpp/**/CMakeLists.txt
      - cpp/tests/find_package_smoke/**
      - cpp/tests/link_export_probe/**
      - src/monoprop/bindings/CMakeLists.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake:
    name: Flake on ${{ matrix.runner }} (Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}

    continue-on-error: ${{ matrix.runner == 'macos-15' }}

    # Each monoprop build is a heavy template compile, and a 7 GB macos-15
    # runner swaps with more than two at once, so CI builds one interpreter.
    # Python 3.12 is the one the binary cache covers least, i.e. the one whose
    # dependency overrides in flake.nix are most likely to break.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-15, ubuntu-26.04-arm]
        python: ["312"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5

      # Evaluates every output, the `nix run` app and the other interpreters'
      # packages included, without building; the checks are the per-interpreter
      # serial packages, built below for this job's interpreter only. Running the
      # app would compile the default interpreter's package as well, and
      # `pythonImportsCheck` already imports monoprop inside the sandbox.
      - name: Check flake
        run: nix flake check --no-build

      - name: Build packages
        run: >-
          nix build --print-build-logs
          .#monoprop-py${{ matrix.python }}
          .#monoprop-py${{ matrix.python }}-mpi

      - name: Check dev shell
        run: |
          nix develop --command bash -euo pipefail -c '
            cmake --version
            ninja --version
            uv --version
            just --version
            mpicc --version
          '

      # The dev-shell build below runs outside the sandbox, so it can use ccache; the packages above
      # are sandboxed derivations and always compile from scratch.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.26
        with:
          key: nix-dev-shell-${{ runner.os }}-${{ runner.arch }}
          max-size: 1G
          evict-old-files: job

      # Configures, links and runs the installed-package consumer, which instantiates the
      # OpenMP worksharing template, with the shell's compiler and OpenMP runtime. The consumer
      # needs only the installed package: the C++ unit tests run in the other workflows. The
      # nanobind_ROOT copy keeps uv's randomly named build environment out of the binding units'
      # include paths, and Nix's store files all share one mtime, so ccache hashes the compiler's
      # content.
      - name: Check the OpenMP consumer from the dev shell
        run: |
          set -euo pipefail
          NANOBIND_VERSION="$(sed -n '/^\[build-system\]/,/^\[project\]/s/^[[:space:]]*"nanobind==\([^"]*\)",*$/\1/p' pyproject.toml)"
          if [[ -z "$NANOBIND_VERSION" ]]; then
            echo "pyproject.toml pins no nanobind build requirement" >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cpus="$(sysctl -n hw.ncpu)"
          else
            cpus="$(nproc)"
          fi
          export NANOBIND_VERSION CCACHE_COMPILERCHECK=content
          export CMAKE_C_COMPILER_LAUNCHER="$(command -v ccache)"
          export CMAKE_CXX_COMPILER_LAUNCHER="$CMAKE_C_COMPILER_LAUNCHER"
          export nanobind_ROOT="$RUNNER_TEMP/nanobind/nanobind"
          export monoprop_ENABLE_MPI=OFF monoprop_ENABLE_CXX_UNIT_TESTS=OFF monoprop_ENABLE_ARCH_FLAGS=OFF
          export SKBUILD_BUILD_TOOL_ARGS="-j$cpus"
          nix develop --command bash -euo pipefail -c '
            uv pip install --quiet --target "$RUNNER_TEMP/nanobind" "nanobind==$NANOBIND_VERSION"
            just build --group workspace-test
            just test-find-package
          '

  flake-result:
    name: All flake checks
    if: always()
    needs: flake
    runs-on: ubuntu-slim

    steps:
      - name: Report the matrix result
        run: |
          echo "flake: ${{ needs.flake.result }}"
          case "${{ needs.flake.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
