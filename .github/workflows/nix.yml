name: Nix flake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    # `nix/monoprop.nix` restates the build inputs, the CMake options and the source
    # set by hand, so it goes stale whenever the upstream build definition moves.
    paths:
      - .github/workflows/nix.yml
      - flake.lock
      - flake.nix
      - nix/**
      - VERSION
      - pyproject.toml
      - CMakeLists.txt
      - cmake/**
      - cpp/**/CMakeLists.txt
      - cpp/tests/find_package_smoke/**
      - cpp/tests/link_export_probe/**
      - src/monoprop/bindings/CMakeLists.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: Flake on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    continue-on-error: ${{ matrix.runner == 'macos-15' }}

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-15, ubuntu-26.04-arm]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      # Builds `checks.monoprop` and `checks.monoprop-mpi`, so the build below reuses
      # both store paths rather than compiling twice.
      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build packages
        run: nix build --print-build-logs .#monoprop .#monoprop-mpi

      # `pythonImportsCheck` already imports the package inside the sandbox; this
      # exercises the `nix run` app, i.e. the interpreter with monoprop propagated
      # into its environment.
      - name: Run app
        run: nix run . -- -c 'import monoprop; print(monoprop.__version__)'

      - name: Check dev shell
        run: |
          nix develop --command bash -euo pipefail -c '
            cmake --version
            ninja --version
            uv --version
            just --version
            pkg-config --modversion hwloc
            mpicc --version
          '

      # Configures, links and runs the installed-package consumer, which instantiates the
      # OpenMP worksharing template, with the shell's compiler and OpenMP runtime.
      - name: Check the OpenMP consumer from the dev shell
        run: |
          nix develop --command bash -euo pipefail -c '
            monoprop_ENABLE_MPI=OFF just build --group workspace-test
            just test-find-package
          '

  flake-result:
    name: All flake checks
    if: always()
    needs: flake
    runs-on: ubuntu-slim

    steps:
      - name: Report the matrix result
        run: |
          echo "flake: ${{ needs.flake.result }}"
          case "${{ needs.flake.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
