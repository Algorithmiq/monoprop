# Simple workflow for deploying static content to GitHub Pages
name: Documentation

# specify which events will trigger this workflow
on:
  # run on all pushed to main
  push:
    branches:
      - main
  # PRs trigger for the "opened", "reopened", "synchronize" events (default) and
  # "ready_for_review"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # when new commits are pushed to the PR
      - ready_for_review # when the PR is un-drafted

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  COLUMNS: 120
  CPM_USE_LOCAL_PACKAGES: "TRUE"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # grab the history of the PR, so setuptools-scm can compute the correct version number
          fetch-depth: 0

      - name: Install dependencies from APT
        run: |
          sudo apt-get update
          sudo apt-get install -y just libtbb-dev libopenmpi-dev openmpi-bin

      - name: Set gcc-14/g++-14 as default compilers
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 140
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 140
          sudo update-alternatives --set cc /usr/bin/gcc-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 140
          sudo update-alternatives --set g++ /usr/bin/g++-14
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 140
          sudo update-alternatives --set c++ /usr/bin/g++-14

      - name: Install dependencies
        run: |
          ./tools/install-deps.sh /opt/Software --skip-boost-test --skip-msgpack

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install package
        run: |
          echo "CMAKE_PREFIX_PATH=/opt/Software" >> "$GITHUB_ENV"
          CMAKE_PREFIX_PATH=/opt/Software uv sync --group docs --all-extras

      # `just build-docs` runs, in order: docs-install (npm ci), gen-api
      # (docstrings -> API reference MDX), doctest-py (runnable docstring
      # examples), gen-notebooks (executes the tutorial notebooks, failing on
      # any cell error), then the static Next.js export into `docs/out`.
      - name: Build docs
        run: |
          just build-docs

      - name: Setup Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/out

      # Separate from the Pages-specific artifact above (which only exists for
      # main): the Cloudflare deploy job below needs `docs/out` for PR builds
      # too, to publish a preview.
      - name: Upload docs site artifact
        uses: actions/upload-artifact@v5
        with:
          name: docs-site
          path: docs/out
          retention-days: 1

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download docs site artifact
        uses: actions/download-artifact@v6
        with:
          name: docs-site
          path: docs/out

      # `monoprop-docs` is the Cloudflare Pages project created by `just
      # build-docs && npx wrangler pages deploy docs/out
      # --project-name=monoprop-docs` (see docs/public/_redirects for how
      # `/monoprop/*` gets served correctly from this same export). Requires
      # the `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` repo secrets.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy docs/out --project-name=monoprop-docs
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}

      - name: Comment preview link on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- cloudflare-docs-preview -->';
            const url = `${{ steps.deploy.outputs.pages-deployment-alias-url }}/monoprop/`;
            const body = `${marker}\nDocs preview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
