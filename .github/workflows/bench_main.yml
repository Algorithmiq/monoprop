name: Track benchmarks

# Builds the historical baseline that Bencher's Perf page graphs and that pull
# request runs are compared against. One data point per commit on main.
# Alerts are recorded but do not fail the job for now.


on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-hosted:
    uses: ./.github/workflows/bench.yml
    with:
      runner: ubuntu-26.04
      testbed: ubuntu-26.04
      label: ci-linux
    secrets: inherit
    permissions:
      contents: read
      checks: write
