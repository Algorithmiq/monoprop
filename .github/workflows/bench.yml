name: Benchmark

# Shared body of the Bencher runs; the caller names the machine and the benches/LADDER.md rungs.

on:
  workflow_call:
    inputs:
      runner:
        description: Value for the job's `runs-on`.
        required: true
        type: string
      label:
        description: Result-artifact prefix; each rung uploads as `<label>-<rung>`.
        required: true
        type: string
      rungs:
        description: >-
          One rung per line, `<name> <ranks> <partitions> <rounds> | <pytest args>`.
          `partitions` is an integer or `per-rank` for (physical cores / ranks).
          Blank lines and `#` comments are ignored. A name may carry a `.suffix`: the
          Bencher testbed is the part before the first `.`, so rungs sharing a prefix
          share a plot, which is how one shape measured by two processes keeps its rows
          together.
        required: true
        type: string

env:
  FORCE_COLOR: 3
  COLUMNS: 120
  CPM_USE_LOCAL_PACKAGES: "TRUE"

jobs:
  benchmark:
    name: Continuous benchmarking with Bencher
    # Skips forks, which have no BENCHER_API_KEY.
    if: ${{ github.repository == 'Algorithmiq/monoprop' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build environment
        uses: ./.github/actions/setup
        with:
          # A cache filled by a non-MPI build would restore a monoprop without MPI, which every
          # rung below then shares.
          cache-suffix: benchmark-mpi
          # The build below requires MPI::MPI_CXX, and the multi-rank rungs need mpiexec.
          mpi: "on"

      - name: Install package
        env:
          SKBUILD_CMAKE_DEFINE: monoprop_ENABLE_CXX_UNIT_TESTS=OFF
          monoprop_ENABLE_MPI: "ON"
        run: just build --group bench

      # This step and the two below run their commands inline rather than through a recipe:
      # the ladder is only meaningful in CI, so it lives with the workflow that defines it.
      # `tools/check-workflow-commands.py` exempts these three by name.
      - name: Resolve the core count
        run: uv run --no-sync python .github/workflows/scripts/resolve_cores.py

      - name: Run the ladder rungs
        env:
          BENCH_LABEL: ${{ inputs.label }}
          RUNGS: ${{ inputs.rungs }}
          # Empty, so a rung's `-k` is the only selector and the slow fixed models are reachable.
          monoprop_BENCH_MARKERS: ""
          # The RunsOn images run as root, and OpenMPI refuses to launch there without these.
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
        run: |
          set -euo pipefail
          : "${BENCH_CORES:?the 'Resolve the core count' step did not export it}"
          echo "physical cores: $BENCH_CORES"
          mkdir -p benches/results
          # fd 3, because mpiexec forwards its own stdin to rank 0 and would eat the rung list.
          while IFS='|' read -r head args <&3; do
            IFS=$' \t' read -r rung ranks partitions rounds <<<"$head"
            case "${rung:-}" in '' | '#'*) continue ;; esac
            # The name reaches a result filename, a Bencher testbed and the prefix split
            # below, so hold it to what all three accept. A leading `.` would split to an
            # empty testbed.
            case "$rung" in
              *[!A-Za-z0-9.-]* | .*)
                echo "::error::rung name '$rung' must be [A-Za-z0-9.-] and cannot start with '.'"
                exit 1 ;;
            esac
            # A missing field would otherwise fall through to a default and measure something
            # else; a non-numeric one reaches the arithmetic below as an unset name, so worth 0;
            # `0` divides by zero at per-rank and reaches `mpiexec -n 0` otherwise; and `08` is
            # an invalid octal literal there. Rejecting leading zeros keeps that arithmetic
            # base 10.
            for field in ranks partitions rounds; do
              value="${!field:-}"
              [[ "$field" == partitions && "$value" == per-rank ]] && continue
              case "$value" in
                '') echo "::error::rung $rung has no $field"; exit 1 ;;
                *[!0-9]* | 0*)
                  echo "::error::rung $rung needs a positive decimal $field, not '$value'"
                  exit 1 ;;
              esac
            done
            if [[ "$partitions" == per-rank ]]; then
              partitions=$((BENCH_CORES / ranks))
            fi
            # Oversubscription reports a plausible wall time and would silently corrupt the
            # testbed.
            if ((partitions < 1 || ranks * partitions > BENCH_CORES)); then
              echo "::error::rung $rung wants ${ranks}x${partitions} on $BENCH_CORES physical cores"
              exit 1
            fi
            # xargs honours quotes in `-k "a and b"` without evaluating the input.
            argv=()
            if [[ -n "${args//[[:space:]]/}" ]]; then
              if ! parsed=$(printf '%s\n' "$args" | xargs printf '%s\n') || [[ -z "$parsed" ]]; then
                echo "::error::rung $rung: could not parse its pytest args"
                exit 1
              fi
              readarray -t argv <<< "$parsed"
            fi
            label="$BENCH_LABEL-$rung"
            echo "::group::$rung: ${ranks}x${partitions}, $rounds rounds -> $label"
            # `monoprop_PARTITIONS` also sizes the pinning below -- unpinned ranks vary by more
            # than the effects being tracked.
            export monoprop_PARTITIONS="$partitions" monoprop_NUM_THREADS="$partitions"
            export monoprop_BENCH_LABEL="$label" monoprop_BENCH_RESULTS=benches/results
            if ((ranks == 1)); then
              uv run --no-sync python -m pytest benches -o filterwarnings=default \
                --benchmark-json="benches/results/time-$label.json" \
                -m "${monoprop_BENCH_MARKERS-not slow}" \
                --bench-rounds "$rounds" "${argv[@]}"
            else
              uv run --no-sync mpiexec -n "$ranks" \
                --map-by "slot:PE=$monoprop_PARTITIONS" --bind-to core \
                -x monoprop_BENCH_LABEL -x monoprop_BENCH_RESULTS \
                -x monoprop_PARTITIONS -x monoprop_NUM_THREADS \
                python -m pytest benches -o filterwarnings=default \
                --benchmark-json="benches/results/time-$label.json" \
                -m "${monoprop_BENCH_MARKERS-not slow}" \
                --bench-rounds "$rounds" "${argv[@]}"
            fi
            # One BMF file per rung: each Bencher upload accepts one adapter.
            uv run --no-sync monoprop-bench-bmf benches/results "$label" > "bmf-$rung.json"
            # To the log too: a rung that OOMs the instance takes the artifact with it.
            cat "bmf-$rung.json"
            uv run --no-sync python .github/workflows/scripts/check_shape.py \
              "benches/results/$label.json" "$ranks" "$partitions"
            echo "::endgroup::"
          done 3<<< "$RUNGS"

      - name: Upload the raw measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ inputs.label }}
          path: |
            bmf-*.json
            benches/results/*.json
          if-no-files-found: warn

      - uses: bencherdev/bencher@v0.6.12

      # The project slug and API key go through the environment: `bencher` reads
      # BENCHER_PROJECT / BENCHER_API_KEY natively, and it keeps a maintainer-set
      # variable out of the shell's parsing.
      - name: Track benchmarks with Bencher
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT || 'monoprop' }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(bmf-*.json)
          if ((${#files[@]} == 0)); then
            echo "::error::no rung produced a bmf-*.json"
            exit 1
          fi
          slug=$(uv run --no-sync python .github/workflows/scripts/cpu_slug.py)
          case "$slug" in '' | *[!a-z0-9-]*) echo "::error::bad cpu slug: '$slug'"; exit 1 ;; esac
          echo "cpu slug: $slug"
          for file in "${files[@]}"; do
            rung="${file#bmf-}"
            rung="${rung%.json}"
            # Rungs sharing a prefix share a testbed: `L2a.ops` and `L2a.propagate` are one
            # shape in two processes, and Bencher keys history on the testbed, so this is
            # what puts their rows on one plot.
            testbed="${rung%%.*}"
            BENCHER_TESTBED="$slug-${BENCH_CORES}c-$testbed" bencher run \
              --adapter json \
              --file "$file" \
              --github-actions "$GITHUB_TOKEN" \
              --thresholds-reset \
              --threshold-measure latency \
              --threshold-test t_test \
              --threshold-min-sample-size 12 \
              --threshold-max-sample-size 64 \
              --threshold-lower-boundary _ \
              --threshold-upper-boundary 0.99 \
              --threshold-measure peak-memory \
              --threshold-test percentage \
              --threshold-max-sample-size 64 \
              --threshold-lower-boundary _ \
              --threshold-upper-boundary 0.10 \
              --threshold-measure operation-memory \
              --threshold-test percentage \
              --threshold-max-sample-size 64 \
              --threshold-lower-boundary _ \
              --threshold-upper-boundary 0.10 \
              --threshold-measure terms \
              --threshold-test percentage \
              --threshold-max-sample-size 1 \
              --threshold-lower-boundary 0.0 \
              --threshold-upper-boundary 0.0
          done
