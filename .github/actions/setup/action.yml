name: Set up a monoprop CI environment
description: >-
  Install just, uv, and the packages listed in tools/packages/. Installs tools,
  not commands: anything a developer also runs belongs in the justfile.

inputs:
  python-version:
    description: Python version handed to setup-uv.
    required: false
    default: "3.11"
  cache-suffix:
    description: >-
      setup-uv cache key suffix. Must differ per build configuration, or a
      restored cache carries a wheel built for another one.
    required: true
  mpi:
    description: >-
      Install an MPI implementation: "on" (Open MPI), "mpich", or "off".
    required: false
    default: "off"
  build-deps:
    description: >-
      Install the packages needed to build monoprop (tools/packages/<manager>.txt). Jobs that only
      test a built wheel skip them; Ubuntu 22.04 lacks some of them.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install just
      uses: extractions/setup-just@v4.0.0

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-suffix: ${{ inputs.cache-suffix }}
        python-version: ${{ inputs.python-version }}

    - name: Install system dependencies
      shell: bash
      env:
        MPI: ${{ inputs.mpi }}
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        set -euo pipefail

        # macOS runners still ship bash 3.2, so no mapfile and no ${var,,}.
        packages=()
        add_list() {
          if [[ ! -f "$1" ]]; then
            echo "no package list $1 for mpi=$MPI on $RUNNER_OS" >&2
            exit 2
          fi
          while IFS= read -r package; do
            packages+=("$package")
          done < <(sed -e 's/#.*//' -e 's/[[:space:]]*$//' "$1" | grep -v '^$' || true)
        }

        if [[ "$RUNNER_OS" == "macOS" ]]; then
          prefix=tools/packages/brew
        else
          prefix=tools/packages/apt
        fi

        if [[ "$BUILD_DEPS" == "true" ]]; then
          add_list "$prefix.txt"
        fi
        mpi="$(printf '%s' "$MPI" | tr '[:upper:]' '[:lower:]')"
        if [[ "$mpi" =~ ^(on|true|yes|1)$ ]]; then
          add_list "$prefix-mpi.txt"
        elif [[ "$mpi" == mpich ]]; then
          add_list "$prefix-mpich.txt"
        fi

        # Derive the package from CXX, so a matrix lane needs no list of its own.
        if [[ -n "${CXX:-}" ]] && ! command -v "$CXX" > /dev/null; then
          case "$CXX" in
            clang++*) packages+=("clang${CXX#clang++}") ;;
            g++*) packages+=("g++${CXX#g++}") ;;
            *)
              echo "CXX=$CXX is not installed and no package name can be derived from it" >&2
              exit 2
              ;;
          esac
        fi

        if (( ${#packages[@]} > 0 )); then
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install "${packages[@]}"
          else
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
        fi

        # Ubuntu 22.04 and older name MPICH's library libmpich.so.12, not the libmpi.so.12 the MPICH
        # ABI requires; this is the system-wide fix mpi4py's installation guide gives.
        libdir="/usr/lib/$(uname -m)-linux-gnu"
        if [[ "$mpi" == mpich && -e "$libdir/libmpich.so.12" && ! -e "$libdir/libmpi.so.12" ]]; then
          sudo ln -sr "$libdir/libmpich.so.12" "$libdir/libmpi.so.12"
        fi
