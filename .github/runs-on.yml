# RunsOn runner definitions (https://runs-on.com/docs/runners/labels/).
#
# Read from the default branch on public repositories, so edits here only take
# effect once merged.

runners:
  # Used by .github/workflows/bench_bare_metal.yml.
  #
  # Pinned rather than ranged: the testbed is named after this CPU and its core count, so widening
  # any field renames the testbed and stops the old series rather than corrupting it.
  bench:
    # Avoid expand to partial family
    family: ["c7i.4xlarge"]
    cpu: 16
    ram: 32
    image: ubuntu26-full-x64
    volume: 40gb:gp3
    spot: false
    ssh: false
