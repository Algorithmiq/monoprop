sonar.projectKey=Algorithmiq_monoprop
sonar.organization=algorithmiq

sonar.projectName=monoprop
sonar.sources=cpp/monoprop,cpp/include,src/monoprop
sonar.exclusions=benches/*,src/monoprop/_version.py,src/monoprop/_dispatch.py
sonar.test.exclusions=tests/data/**
sonar.sourceEncoding=UTF-8
sonar.tests=tests
sonar.verbose=true
sonar.python.version=3.11,3.12,3.13,3.14
sonar.lang.patterns.c=**/*.c
sonar.lang.patterns.cpp=**/*.cpp,**/*.h,**/*.hpp,**/*.inl

# Coverage is generated by the code-coverage job in .github/workflows/qa-analysis.yml and
# handed to the sonarqube-analysis job as the `coverage-reports` artifact. Without these,
# Sonar reports 0% regardless of what Codecov shows.
sonar.python.coverage.reportPaths=python-coverage.xml
sonar.coverageReportPaths=cpp-coverage.xml,cpp-coverage-through-python-bindings.xml
