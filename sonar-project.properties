sonar.projectKey=Algorithmiq_monoprop
sonar.organization=algorithmiq

sonar.projectName=monoprop
sonar.sources=cpp/monoprop,cpp/include,src/monoprop
sonar.exclusions=benches/**,packages/**,src/monoprop/_version.py
sonar.test.exclusions=tests/data/**
sonar.sourceEncoding=UTF-8
sonar.tests=tests
sonar.verbose=true
sonar.python.version=3.11,3.12,3.13,3.14
sonar.lang.patterns.c=**/*.c
sonar.lang.patterns.cpp=**/*.cpp,**/*.h,**/*.hpp,**/*.inl

# Coverage is generated by the code-coverage job in .github/workflows/qa-analysis.yml and
# handed to the sonarqube-analysis job as the `coverage-reports` artifact. Without these,
# Sonar reports 0% regardless of what Codecov shows.
sonar.python.coverage.reportPaths=python-coverage.xml
sonar.coverageReportPaths=cpp-coverage-sonar.xml,cpp-coverage-through-python-bindings-sonar.xml

# Deliberate design decisions, not defects. Each entry is scoped to one file and one rule so
# unrelated findings in the same file still surface. Do not widen these to project-level
# patterns. The rationale lives next to the code in every case.
sonar.issue.ignore.multicriteria=barrier,hybridtypes,commvalue1,commvalue2,commvalue3,typeerasure1,typeerasure2,commimplicit,allocrebind,includeorder,bitsetalloc,bitsetfriend

# S8417 wants seq_cst. PartitionBarrier is a sense-reversing generation barrier whose
# acquire/release/relaxed orderings are deliberate and documented in-file; seq_cst would put
# a full barrier in the hot spin loop of a measured hotspot (S=112).
sonar.issue.ignore.multicriteria.barrier.ruleKey=cpp:S8417
sonar.issue.ignore.multicriteria.barrier.resourceKey=cpp/monoprop/detail/mpi/PartitionBarrier.h

# S5827 wants `auto` for cast-initialized locals. The explicit `const size_t`/`const int` on
# this file's index arithmetic documents the widening, in code whose comments stress
# bit-identical reproducibility.
sonar.issue.ignore.multicriteria.hybridtypes.ruleKey=cpp:S5827
sonar.issue.ignore.multicriteria.hybridtypes.resourceKey=cpp/monoprop/detail/mpi/HybridComm.h

# S1238 wants `const mpi::Comm &`. Comm is a 32-40 byte trivially-copyable non-owning POD,
# documented in detail/mpi/Comm.h as passed by value on purpose. Roughly ten further
# by-value Comm parameters are unflagged, so fixing only these would contradict the
# codebase's own stated convention.
sonar.issue.ignore.multicriteria.commvalue1.ruleKey=cpp:S1238
sonar.issue.ignore.multicriteria.commvalue1.resourceKey=cpp/monoprop/Evolution.cpp
sonar.issue.ignore.multicriteria.commvalue2.ruleKey=cpp:S1238
sonar.issue.ignore.multicriteria.commvalue2.resourceKey=cpp/monoprop/MPFunctions.cpp
sonar.issue.ignore.multicriteria.commvalue3.ruleKey=cpp:S1238
sonar.issue.ignore.multicriteria.commvalue3.resourceKey=cpp/monoprop/detail/pare/PareGraph.cpp

# S5213 wants a template parameter instead of std::function. These are a deliberate
# type-erasure boundary (see detail/evolution/CosineRecomputeCallbacks.h): templating would
# force monoprop_EXPORT definitions into public headers and instantiate per algebra and store.
# The callbacks are invoked once per layer, not per term, so there is no performance case.
sonar.issue.ignore.multicriteria.typeerasure1.ruleKey=cpp:S5213
sonar.issue.ignore.multicriteria.typeerasure1.resourceKey=cpp/monoprop/Evolution.cpp
sonar.issue.ignore.multicriteria.typeerasure2.ruleKey=cpp:S5213
sonar.issue.ignore.multicriteria.typeerasure2.resourceKey=cpp/monoprop/detail/pare/PareGraph.cpp

# S1709 wants `explicit`. Comm's MPI_Comm constructor is implicit on purpose so the same SPMD
# code accepts a raw communicator; see the comment on the declaration.
sonar.issue.ignore.multicriteria.commimplicit.ruleKey=cpp:S1709
sonar.issue.ignore.multicriteria.commimplicit.resourceKey=cpp/monoprop/detail/mpi/Comm.h

# S1709 on TypeAliases.h targets the allocator rebind converting constructor. Allocator
# requirements expect a rebound allocator to be convertible; making it explicit would break
# DefaultInitVector instantiation.
sonar.issue.ignore.multicriteria.allocrebind.ruleKey=cpp:S1709
sonar.issue.ignore.multicriteria.allocrebind.resourceKey=cpp/monoprop/TypeAliases.h

# S954 wants includes at the top. The mid-file include order in TypeAliases.h is load-bearing
# and documented at the include site: OperatorIndex.h needs TermIndex and MonomialHash
# defined first.
sonar.issue.ignore.multicriteria.includeorder.ruleKey=cpp:S954
sonar.issue.ignore.multicriteria.includeorder.resourceKey=cpp/monoprop/TypeAliases.h

# S5025 wants smart-pointer management for the new[]/delete[] pairs in Bitset's spilled-storage
# path. The heap pointer is one member of the hand-rolled Storage union (see the class comment),
# sharing storage with the inline word array so a non-spilled Bitset pays no allocation; a
# unique_ptr<word_type[]> there changes the union's active-member rules and its trivial
# default-construction, which is exactly what made the S3490 "=default" rewrite of this same union
# a real regression (a hand-written empty-body constructor is user-provided; =default is not, and
# Bitset's const-default-constructibility depends on that). The raw new/delete are matched 1:1 in
# the five special members that touch s_.heap_ and are exercised by bitset_tests.cpp, including
# under ASan.
sonar.issue.ignore.multicriteria.bitsetalloc.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.bitsetalloc.resourceKey=cpp/monoprop/Bitset.h

# S2807 wants operator== rewritten as a hidden friend. Bitset's constructors are all explicit
# (no implicit-conversion targets for ADL to help with), so a hidden friend and the current member
# function are behaviorally identical here; converting this operator alone would leave the rest of
# the class's large operator surface (operator>>, operator&, ...) inconsistent. Revisit together
# with the S1448 "split this class" finding on the same file rather than one operator at a time.
sonar.issue.ignore.multicriteria.bitsetfriend.ruleKey=cpp:S2807
sonar.issue.ignore.multicriteria.bitsetfriend.resourceKey=cpp/monoprop/Bitset.h
