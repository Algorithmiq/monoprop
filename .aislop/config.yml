# aislop configuration for monoprop
# Detects AI-generated code patterns in Python and supported languages
# See: https://github.com/scanaislop/aislop/blob/main/docs/configuration.md

# Exclude patterns (same glob semantics as .gitignore)
exclude:
  - "src/bindings/bindings.cpp"
  - "build/"
  - "dist/"
  - "*.egg-info/"

# Rule severity overrides
# Keep defaults but adjust if false positives appear
rules:
  # Example: turn off a noisy rule if needed
  # ai-slop/narrative-comment: warning  # error | warning | off

# CI/CD gating (report-only mode for now)
ci:
  # Don't fail on low scores yet; this is educational
  # Uncomment to enforce: failBelow: 70
